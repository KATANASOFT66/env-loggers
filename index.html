<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua Deobfuscator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00d9ff;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
        }

        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .panel-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #00d9ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 400px;
            background: #0d1117;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            color: #c9d1d9;
            font-family: 'Courier New', Consolas, monospace;
            font-size: 14px;
            padding: 15px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #00d9ff;
            box-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-deobfuscate {
            background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
            color: #000;
        }

        .btn-deobfuscate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.4);
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-copy {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: #fff;
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.4);
        }

        .status {
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
            display: block;
        }

        .status.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #00d9ff;
        }

        .stat-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔓 Lua Deobfuscator</h1>
        
        <div id="status" class="status"></div>

        <div class="controls">
            <button class="btn-deobfuscate" onclick="deobfuscate()">Deobfuscate</button>
            <button class="btn-clear" onclick="clearAll()">Clear All</button>
            <button class="btn-copy" onclick="copyOutput()">Copy Output</button>
        </div>

        <div class="editor-container">
            <div class="panel">
                <div class="panel-title">📥 Input (Obfuscated Lua)</div>
                <textarea id="input" placeholder="Paste your obfuscated Lua code here..."></textarea>
            </div>
            <div class="panel">
                <div class="panel-title">📤 Output (Deobfuscated Lua)</div>
                <textarea id="output" readonly placeholder="Deobfuscated code will appear here..."></textarea>
            </div>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat-card">
                <div class="stat-value" id="stringsDecoded">0</div>
                <div class="stat-label">Strings Decoded</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="functionsRenamed">0</div>
                <div class="stat-label">Functions Renamed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="junkRemoved">0</div>
                <div class="stat-label">Junk Code Removed</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="sizeReduction">0%</div>
                <div class="stat-label">Size Reduction</div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
